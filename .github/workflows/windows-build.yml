name: Windows build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven

      - name: Verify clean builds and release packaging
        shell: pwsh
        run: ./scripts/verify.ps1
